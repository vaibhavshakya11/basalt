  how_it_works: How it works
  how_steps:
    - NASA POWER daily weather since 1990 feeds a FAO-56 estimate of crop water use.
    - A daily soil-water model replays each rotation through 24 seasons.
    - Each option is compared season by season with your current rotation.
    - Satellites check the calendar and water use.
    - A sensitivity test lists what to check locally.
