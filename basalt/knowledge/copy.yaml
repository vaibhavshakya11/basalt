  satellites_text: Satellites see large areas often but indirectly; ground sensors are exact but only at one spot. basalt uses satellites and NASA weather to describe your area, and asks you to confirm what you know about your own field.
  datasets_heading: How the data fit together
  datasets_text: "Every dataset is aligned to your field's location and a daily timeline: NASA POWER weather (~50 km, daily), MODIS greenness (250 m, every 16 days), MODIS water use (500 m, 8-day), SMAP soil moisture (9 km), GRACE-FO water storage (~300 km, monthly), crop calendars (GGCMI, 0.5°), soil texture (SoilGrids, 250 m)."
  limitations: Limits of the comparison
  limits:
    - The model uses a single point for your field.
    - Disease and nutrient balance are not modelled.
    - The soil score compares practices that can affect soil over time.
    - Regional crop calendars reflect conditions around the 2000s.
    - NASA POWER combines a weather model and observations.
    - GRACE and GRACE-FO measure water storage across regions.
    - FIRMS can miss small fires or afternoon fires.
