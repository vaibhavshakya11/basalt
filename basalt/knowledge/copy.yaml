  soil_class:
    label: your soil texture
    local: "Confirm your soil texture with a sample or a local adviser."
  burn_window:
    label: time to manage crop residue
    local: "Check how much time and equipment you have for handling residue before the next sowing."
  soil_weight_living_cover:
    label: the weight given to living roots
    local: "The comparison changes with the importance placed on keeping living roots."
  soil_weight_residue_kept:
    label: the weight given to keeping crop residue
    local: "The comparison changes with the importance placed on retaining residue."
  soil_weight_legume_months:
    label: the weight given to legumes
    local: "The comparison changes with the importance placed on time growing legumes."
  soil_weight_no_puddling:
    label: the weight given to avoiding puddling
    local: "The comparison changes with the importance placed on avoiding puddling."
  soil_weight_pest_cycle_break:
    label: the weight given to crop diversity
    local: "The comparison changes with the importance placed on rotating crop families."
  soil_weight_erosive_rain_bare:
    label: the weight given to heavy rain on bare soil
    local: "The comparison changes with the importance placed on protecting soil from heavy rain."
  arrow_threshold:
    label: the number of seasons needed for an arrow
    local: "Look at the season counts. The arrow changes when we require more or fewer wins."
assumptions:
  both:
    - "A soil arrow needs a difference of at least 2 points in a season. An arrow changes when the option wins or loses in at least 16 of 24 seasons."
    - "Bare soil uses a crop coefficient of 0.25 after at least 5 mm of rain or irrigation in 3 days, and 0.10 otherwise."
    - "A crop is heat-hit after 3 hot days in its flowering window. The frost threshold, when applied, is 2 °C."
    - "The heavy-rain index uses rain events of at least 12.7 mm. Local slope is omitted."
    - "The soil score averages six indicators of field practices. Newly reached soil is assumed to start at field capacity."
    - "The residue model uses the time between crops. Residue machinery multiplies predicted burning pressure by 0.3."
  irrigated:
    - "The water arrow compares water use by crops and soil, with a 3% threshold in each season. Irrigation pumping is shown alongside it."
    - "For crops outside ponded rice, the model assumes 60% of pumped water reaches the crop roots and tests 50% to 75%."
  puddled:
    - "The model assumes 200 mm of water for puddling over 7 days (150 to 300 mm range). It tests rice field drainage from 2 to 15 mm/day."
  demo_soil:
    - "The demo soil class is a default. Confirm the texture with a local adviser."
  global:
    - "Crop stages use global fractions applied to the length of the local calendar."
    - "For rainfed crops, the water arrow compares the fraction of mid-season days with strong dry stress, using a 0.05 difference to count a win."
  gap:
    - "Gap-crop screening uses approximate warmth and frost limits. Check the variety with a local adviser."
  added: "{value}. {reason}"
glossary:
  evapotranspiration: "Water that leaves the field as vapour, evaporating from the soil and released by plants. It is the water your crops actually use."
  ndvi: "A satellite measure of how green and dense plants are. It rises as crops grow and falls at harvest."
  soil_moisture: "How much wetter or drier the soil is than usual for that time of year."
  frost_risk: "The chance of temperatures near freezing while a crop is sensitive."
  water_balance: "Bookkeeping of water in the root zone: rain and irrigation in; crop use, runoff and drainage out."
  growing_degree_days: "A count of warmth a crop needs to grow; warmer days add more."
  season: "One farming year at this place, starting {season_year_start}."
