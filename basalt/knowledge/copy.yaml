    label: Nitrogen-fixing
    description: "Legumes host bacteria that pull nitrogen from the air into the soil, so the next crop may need less fertiliser."
  cover:
    label: Cover
    description: "Living roots and leaves protect bare soil from sun, wind and heavy rain, and feed soil life."
  deep_rooting:
    label: Deep-rooting
    description: "Deep roots can break up compacted layers and reach water further down."
  drought_tolerant:
    label: Drought-tolerant
    description: "Keeps growing through dry spells better than most crops."
  fodder_value:
    label: Fodder
    description: "Leaves or stalks can feed livestock."
  extra_harvest:
    label: Extra harvest
    description: "Adds a harvest you could eat or sell. Check local prices."
