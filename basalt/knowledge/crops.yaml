  mai: maize
  ri1: rice
  swh: wheat_spring
  wwh: wheat_winter
  soy: soybean
  nut: groundnut
  bea: beans
  pea: pea
  sor: sorghum
  mil: millet
  cot: cotton
  rap: rapeseed
  ri2: rice

assumptions:
- scope: global and gap crops
  parameter: zr_min_m
  value: 0.30 m for rice, 0.15 m for all others
  source: assumption
  confidence: L
  reason: Starting root depths follow the corresponding Punjab rice and non-rice defaults where sections 7.3 and 7.5 only specify mature roots.
