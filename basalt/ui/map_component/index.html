<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field location map</title>
<style>
  @font-face{font-family:'IBM Plex Mono';src:url('../../app/static/fonts/IBMPlexMono-Regular.ttf') format('truetype');font-display:swap}
  :root{color:#24272B;background:#f7f7f6}
  body{margin:0;overflow:hidden;font-family:'IBM Plex Mono',monospace}
  .map-frame{position:relative;border:1px solid #d5d8db;border-radius:4px;overflow:hidden;background:#f2f3f4}
  canvas{display:block;width:100%;height:246px}
  canvas[tabindex="0"]{cursor:crosshair}
  canvas:focus-visible{outline:2px solid #a4472a;outline-offset:-2px}
  #controls{position:absolute;top:8px;right:8px;display:grid;gap:4px}
  [hidden]{display:none!important}
  button{display:grid;place-items:center;font:400 19px/1 'IBM Plex Mono',monospace;width:44px;height:44px;
    background:#fff;border:1px solid #d5d8db;border-radius:4px;color:#24272b}
  button:focus-visible{outline:2px solid #a4472a;outline-offset:-2px}
  button:disabled{color:#70767a;cursor:default;background:#f7f7f6}
  #point{position:absolute;bottom:8px;left:8px;margin:0;padding:4px 8px;background:#fff;
    border:1px solid #d5d8db;border-radius:4px;font-size:12px}
  #map-error{position:absolute;inset:40% 16px auto;font:14px/1.45 sans-serif;text-align:center}
  .sr-only{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}
</style>
</head>
<body>
<div class="map-frame">
  <canvas id="map" tabindex="0" role="group" aria-label="Choose a field on the map" aria-describedby="map-help"></canvas>
  <div id="controls" hidden>
    <button type="button" id="zoomIn" aria-label="Zoom in" aria-controls="map">+</button>
    <button type="button" id="zoomOut" aria-label="Zoom out" aria-controls="map">−</button>
  </div>
  <p id="point" role="status" aria-live="polite"></p>
  <p id="map-error" role="status" hidden>Map outlines are unavailable.</p>
</div>
<p class="sr-only" id="map-help">Choose a point with a click or tap. Use the arrow keys to move the pin, plus and minus to zoom, or Home for the world view. You can also type coordinates below the map.</p>
<script src="./map.js"></script>
</body>
</html>
