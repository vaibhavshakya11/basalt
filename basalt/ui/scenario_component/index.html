<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climate scenario controls</title>
<style>
 @font-face{font-family:'IBM Plex Sans';src:url('../../app/static/fonts/IBMPlexSans.ttf') format('truetype');font-weight:100 700;font-display:swap}
 @font-face{font-family:'IBM Plex Mono';src:url('../../app/static/fonts/IBMPlexMono-Regular.ttf') format('truetype');font-display:swap}
 :root{color:#24272b}
 *{box-sizing:border-box}
 body{margin:0;overflow:hidden;font:16px/1.4 'IBM Plex Sans',sans-serif}
 form{margin:0;padding:4px;display:grid;gap:12px}
 [hidden]{display:none!important}
 .range{min-width:0}
 .range label{font-size:14px;font-weight:500}
 .range-header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
 output{font:13px/1.4 'IBM Plex Mono',monospace;white-space:nowrap;color:#a4472a}
 input[type=range]{display:block;width:100%;height:32px;margin:2px 0 0;accent-color:#a4472a;cursor:grab}
 .actions{display:flex;flex-wrap:wrap;gap:8px}
 button{border:1px solid #a4472a;border-radius:4px;min-height:44px;padding:8px 12px;
   font:500 14px/1.3 'IBM Plex Sans',sans-serif;background:#a4472a;color:#fff}
 button[type=button]{background:#fff;border-color:#d5d8db;color:#24272b}
 button:disabled{opacity:.6}
 button:hover{filter:brightness(.93)}
 button:focus-visible,input:focus-visible{outline:2px solid #a4472a;outline-offset:2px}
 #scenario-status{margin:0;font-size:13px;color:#5f656c}
</style>
</head>
<body>
<form id="scenario" hidden>
 <div class="range">
  <div class="range-header"><label for="temperature"></label><output for="temperature" aria-hidden="true"></output></div>
  <input type="range" id="temperature" min="0" max="3" step="0.5" value="0">
 </div>
 <div class="range">
  <div class="range-header"><label for="rainfall"></label><output for="rainfall" aria-hidden="true"></output></div>
  <input type="range" id="rainfall" min="-30" max="30" step="5" value="0">
 </div>
 <div class="actions">
  <button type="submit" id="apply"></button>
  <button type="button" id="reset" hidden></button>
 </div>
 <p id="scenario-status" role="status" hidden></p>
</form>
<script>
 const form = document.querySelector('#scenario');
 const temperature = document.querySelector('#temperature');
 const rainfall = document.querySelector('#rainfall');
 const apply = document.querySelector('#apply');
 const reset = document.querySelector('#reset');
 const status = document.querySelector('#scenario-status');
 const notify = (type, fields) => window.parent.postMessage({isStreamlitMessage: true, type, ...fields}, '*');
 const activeValues = input => input.valueAsNumber;
 let appliedValues;
 let sequence = 0;
 let pending;
 const viewHeight = () => notify('streamlit:setFrameHeight', {height: Math.ceil(form.getBoundingClientRect().height)});
 const signed = amount => amount > 0 ? '+' + amount : String(amount);

 function displayValues() {
   for (const [input, unit] of [[temperature, ' °C'], [rainfall, '%']]) {
     const value = activeValues(input);
     const text = signed(value) + unit;
     document.querySelector(`output[for="${input.id}"]`).textContent = text;
     input.setAttribute('aria-valuetext', text);
     input.setAttribute('aria-valuenow', String(value));
   }
   reset.hidden = !appliedValues.some(value => value !== 0);
 }

 function sendValues(submission) {
   notify('streamlit:setComponentValue', {
     dataType: 'json',
     value: {receipt: submission.receipt, temperature: submission.values[0], rainfall: submission.values[1]},
   });
 }

 function setStatus(message, waiting) {
   status.textContent = message;
   status.hidden = !message;
   for (const control of [temperature, rainfall, apply, reset]) control.disabled = waiting;
 }

 function finishSubmission(message = '') {
   clearTimeout(pending.retry);
   clearTimeout(pending.timeout);
   pending = undefined;
   setStatus(message, false);
 }

 function submitValues() {
   const values = [activeValues(temperature), activeValues(rainfall)];
   if (pending || values.every((value, index) => value === appliedValues[index])) return;
   pending = {receipt: `${Date.now()}-${++sequence}`, values};
   setStatus('The replay is updating with your settings.', true);
   sendValues(pending);
   // Retry the same request once in case the host lost its connection.
   pending.retry = setTimeout(() => sendValues(pending), 5000);
   pending.timeout = setTimeout(() => finishSubmission('The replay did not confirm the change. You can try again.'), 12000);
 }

 form.addEventListener('input', displayValues);
 form.addEventListener('submit', event => {
   event.preventDefault();
   submitValues();
 });
 reset.addEventListener('click', () => {
   temperature.value = '0';
   rainfall.value = '0';
   displayValues();
   submitValues();
 });

 window.addEventListener('message', event => {
   if (event.source !== window.parent || event.data?.type !== 'streamlit:render') return;
   const args = event.data.args;
   document.querySelector('label[for=temperature]').textContent = args.temperature_label;
   document.querySelector('label[for=rainfall]').textContent = args.rainfall_label;
   apply.textContent = args.apply_label;
   reset.textContent = args.reset_label;
   const next = [args.temperature, args.rainfall];
   if (pending && next.every((value, index) => value === pending.values[index])) finishSubmission();
   if (!appliedValues || next.some((value, index) => value !== appliedValues[index])) {
     appliedValues = next;
     temperature.value = next[0];
     rainfall.value = next[1];
   }
   form.hidden = false;
   displayValues();
   viewHeight();
 });
 new ResizeObserver(viewHeight).observe(form);
 notify('streamlit:componentReady', {apiVersion: 1});
</script>
</body>
</html>
